name: site

# Деплой сайта-визитки (папка `site/`) на GitHub Pages.
#
# Триггерится при любых изменениях в папке `site/**` (path filter) и при
# ручном запуске. Никаких префиксов в сообщении коммита больше не требуется:
#   - release.yml пишет site/latest.json и site/updates.json после публикации
#     релиза;
#   - firefox-finalize.yml дописывает update_hash после загрузки подписанного
#     xpi.
# Оба эти коммита меняют site/** и потому автоматически деплоят сайт здесь.
#
# Требования к репозиторию:
#   - В Settings → Pages → Build and deployment источник должен быть
#     «GitHub Actions» (а не ветка), иначе деплой не сработает.
#   - Права Pages и id-token выдаются через `permissions` ниже, отдельные
#     секреты не нужны.

on:
  push:
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy site to GitHub Pages
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
