name: site

# Деплой сайта-визитки (папка `site/`) на GitHub Pages.
#
# Триггерится двумя способами:
#   1. push в любые файлы `site/**` — для ваших ручных правок статики сайта
#      (коммит от обычного пользователя/токена с правами запускает workflow).
#   2. вручную (workflow_dispatch) и программно из других воркфлоу
#      (release.yml, firefox-finalize.yml) через `gh workflow run site.yml`.
# Примечание: пуш от GITHUB_TOKEN в соседнем workflow НЕ запускает этот
# workflow (защита GitHub от рекурсии), поэтому релизы дёргают его явно
# через `gh workflow run`, а не полагаются на push-триггер.
#
# Требования к репозиторию:
#   - В Settings → Pages → Build and deployment источник должен быть
#     «GitHub Actions» (а не ветка), иначе деплой не сработает.
#   - Права Pages и id-token выдаются через `permissions` ниже, отдельные
#     секреты не нужны.

on:
  push:
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy site to GitHub Pages
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
