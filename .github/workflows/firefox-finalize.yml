# Запускается ВРУЧНУЮ (workflow_dispatch) ПОСЛЕ того, как:
#   1. release.yml собрал и опубликовал релиз vX.Y.Z (архивы -unsign);
#   2. вы подписали tabula-firefox-vX.Y.Z-unsign.xpi на AMO и загрузили
#      ПОДПИСАННЫЙ файл в релиз vX.Y.Z под именем
#      tabula-firefox-vX.Y.Z.xpi (без -unsign).
#
# Воркфлоу берёт подписанный xpi из существующего релиза, считает sha256
# (update_hash), дописывает его в site/updates.json и коммитит. Коммит меняет
# site/**, поэтому Cloudflare (Workers Builds, Git-интеграция) сам перезальёт
# папку site/ на воркер при пуше (без префикса в сообщении).
#
# Запуск без schedule/поллинга — не тратит минуты бесплатного GitHub Actions:
# вы нажимаете один раз, когда подписанный xpi уже загружен.

name: firefox-finalize

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version in X.Y.Z form (tag will be vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: firefox-finalize-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Add update_hash and sync site files
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate inputs
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$VERSION' must be in X.Y.Z form."
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download signed xpi from release
        id: signed
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          ADDON_ID="tabula@withersky.local"
          SIGNED_XPI="tabula-firefox-v${{ steps.meta.outputs.version }}.xpi"

          echo "Looking for $SIGNED_XPI in release $TAG ..."

          # gh release view ищет по тегу, но если релиз создан через веб-UI
          # (draft/prerelease) или тег резолвится неоднозначно, он может
          # вернуть "does not exist". Используем прямой API-вызов по тегу —
          # он видит и опубликованные, и черновики, и pre-release.
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
               --jq '.tag_name' >/dev/null 2>&1; then
            echo "::error::Release for tag $TAG not found via API."
            echo "::error::Check that the release 'Tabula ${TAG#v}' exists and is attached to tag $TAG."
            echo "--- gh release list ---"
            gh release list || true
            echo "------------------------"
            exit 1
          fi

          if gh release download "$TAG" --pattern "${SIGNED_XPI}" --clobber 2>/dev/null && [[ -f "$SIGNED_XPI" ]]; then
            echo "Signed xpi downloaded via gh release download."
          else
            # Фоллбэк: релиз может быть draft/prerelease, где gh release
            # download не находит ассет по тегу. Берём ассет напрямую через
            # API по имени файла (работает и для черновиков).
            echo "gh release download failed — trying API asset lookup..."
            ASSET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              --jq ".assets[] | select(.name == \"${SIGNED_XPI}\") | .id" 2>/dev/null | head -n1)"
            if [[ -z "$ASSET_ID" ]]; then
              echo "::error::Signed xpi '$SIGNED_XPI' not found in release $TAG."
              echo "::error::Upload the AMO-signed file there first, then re-run this workflow."
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
              --header "Accept: application/octet-stream" > "$SIGNED_XPI"
            echo "Signed xpi downloaded via API asset (id=$ASSET_ID)."
          fi

          if [[ -f "$SIGNED_XPI" ]]; then
            UPDATE_HASH="$(sha256sum "${SIGNED_XPI}" | cut -d' ' -f1)"
            echo "Signed xpi found: ${SIGNED_XPI} (sha256:${UPDATE_HASH})"
            echo "update_hash=sha256:${UPDATE_HASH}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::File $SIGNED_XPI not present after download."
            exit 1
          fi

      - name: Patch site/updates.json with update_hash
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          ADDON_ID="tabula@withersky.local"
          SIGNED_XPI="tabula-firefox-v${VERSION}.xpi"
          HASH="${{ steps.signed.outputs.update_hash }}"

          if ! grep -q '"update_hash"' site/updates.json; then
            # Дописываем update_hash к записи релиза. Формат совпадает с тем,
            # что пишет release.yml (без hash). Если записи нет — создаём.
            UPDATE_LINK="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${SIGNED_XPI}"
            jq --arg v "$VERSION" \
               --arg link "$UPDATE_LINK" \
               --arg hash "$HASH" \
               --arg id "$ADDON_ID" '
              .addons[$id].updates as $u
              | ($u | map(.version == $v) | any) as $has
              | if $has then
                  .addons[$id].updates |= map(
                    if .version == $v
                    then .update_link = $link | .update_hash = $hash
                    else . end)
                else
                  .addons[$id].updates += [{
                    version: $v, update_link: $link, update_hash: $hash
                  }]
                end
              ' site/updates.json > site/updates.json.tmp
            mv site/updates.json.tmp site/updates.json
            echo "Patched site/updates.json with update_hash."
          else
            echo "update_hash already present in site/updates.json — skipping patch."
          fi

          echo "--- site/updates.json ---"
          cat site/updates.json

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/updates.json
          if git diff --cached --quiet; then
            echo "Site files unchanged — nothing to commit."
          else
            git commit -m "firefox: add update_hash for ${TAG}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Pushed site/updates.json (${TAG})."
          fi

          # Сайт деплоится автоматически: Cloudflare Workers Builds (Git-интеграция)
          # перезаливает папку site/ при каждом пуше в подключённую ветку.
          # Обновлённый updates.json попадёт на сайт без ручных действий.

      - name: Result
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          echo "::notice::Релиз ${TAG} финализирован (update_hash добавлен)."
          echo "::notice::Firefox-обновление доступно по update_url (updates.json обновлён)."
          echo "::notice::Сайт покажет 'Firefox: подписан' автоматически после пуша (Workers Builds перезальёт site/)."
