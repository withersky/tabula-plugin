name: release

# Триггерится на каждый push в основные ветки. Если первая строка
# commit message начинается с `vX.Y.Z` (например `v1.2.1 - описание`),
# workflow собирает Chrome- и Firefox-варианты, вешает тег
# `vX.Y.Z` на текущий коммит и публикует GitHub Release с прикреплёнными
# архивами (.zip для Chrome, .xpi для Firefox) и телом сообщения в качестве release notes.
#
# Требования:
#   - В manifest.json и manifest.firefox.json поле `version` должно
#     совпадать с `X.Y.Z` (иначе workflow упадёт — это страховка от
#     случайного рассинхрона тега и реальной версии расширения).
#   - В Settings → Actions → General → Workflow permissions должен быть
#     включён «Read and write permissions» (нужно для создания тегов).

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version from commit message
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          # Полное сообщение коммита — это и есть будущие release notes.
          COMMIT_MSG="$(git log -1 --pretty=%B)"

          # Первая непустая строка.
          FIRST_LINE="$(printf '%s\n' "$COMMIT_MSG" | awk 'NF{print; exit}')"
          echo "First line: $FIRST_LINE"

          # Извлекаем X.Y.Z из `vX.Y.Z` в начале первой строки.
          if [[ ! "$FIRST_LINE" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "::notice::First line does not start with vX.Y.Z — skipping release."
            # Выходим кодом 0, чтобы зелёный билд не падал на обычных коммитах.
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${BASH_REMATCH[1]}"
          echo "Detected version: $VERSION"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Release notes = полное сообщение коммита, с заголовком vX.Y.Z.
          {
            echo "## v$VERSION"
            echo
            printf '%s\n' "$COMMIT_MSG"
          } > release_notes.md

      - name: Verify version in manifests
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"

          for f in manifest.json manifest.firefox.json; do
            actual="$(jq -r '.version' "$f")"
            if [[ "$actual" != "$VERSION" ]]; then
              echo "::error file=$f::version '$actual' does not match release '$VERSION'." \
                   "Обновите \"version\" в $f и перекоммитьте."
              exit 1
            fi
            echo "$f: $actual ✓"
          done

      - name: Build artifacts
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh all
          echo "--- dist/chrome ---"
          ls -la dist/chrome
          echo "--- dist/firefox ---"
          ls -la dist/firefox

      - name: Package archives
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"

          # В Firefox-сборке Firefox-манифест лежит как manifest.json,
          # а manifest.firefox.json туда не попадает (build.sh его выкидывает).
          # Поэтому просто архивируем всё содержимое папок.
          # Firefox-сборка упаковывается в .xpi (неподписанную) — суффикс -unsign.

          (cd dist/chrome   && zip -r "../../tabula-chrome-v${VERSION}-unsign.zip"   .)
          (cd dist/firefox  && zip -r "../../tabula-firefox-v${VERSION}-unsign.xpi"  .)

          ls -la tabula-*.zip tabula-*.xpi
          unzip -l "tabula-chrome-v${VERSION}-unsign.zip"  | tail -n +4 | head -n -2 || true
          echo "---"
          unzip -l "tabula-firefox-v${VERSION}-unsign.xpi" | tail -n +4 | head -n -2 || true

      - name: Create git tag
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="v${VERSION}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Если тег уже есть (например, повторный push), обновляем его на HEAD.
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — moving to current HEAD."
            git tag -d "$TAG" >/dev/null 2>&1 || true
            git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
          fi

          git tag "$TAG" HEAD
          git push origin "refs/tags/$TAG"
          echo "Pushed tag $TAG at $(git rev-parse --short HEAD)."

      - name: Publish GitHub Release
        if: steps.meta.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "Tabula v${{ steps.meta.outputs.version }}"
          tag_name: v${{ steps.meta.outputs.version }}
          body_path: release_notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            tabula-chrome-v${{ steps.meta.outputs.version }}-unsign.zip
            tabula-firefox-v${{ steps.meta.outputs.version }}-unsign.xpi
