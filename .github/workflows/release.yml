name: release

# Триггерится на каждый push в основные ветки. Если первая строка
# commit message начинается с `vX.Y.Z` (например `v1.2.1 - описание`),
# workflow собирает Chrome- и Firefox-варианты, вешает тег
# `vX.Y.Z` на текущий коммит и публикует GitHub Release с прикреплёнными
# архивами (.zip для Chrome, .xpi для Firefox) и телом сообщения в качестве release notes.
#
# Требования:
#   - В manifest.json и manifest.firefox.json поле `version` должно
#     совпадать с `X.Y.Z` (иначе workflow упадёт — это страховка от
#     случайного рассинхрона тега и реальной версии расширения).
#   - В Settings → Actions → General → Workflow permissions должен быть
#     включён «Read and write permissions» (нужно для создания тегов).

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Фиксируем версии инструментов: ubuntu-latest со временем меняет
      # дефолтные Node.js и Python, а шаги тестов зависят от них.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Parse version from commit message
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          # Полное сообщение коммита — это и есть будущие release notes.
          COMMIT_MSG="$(git log -1 --pretty=%B)"

          # Первая непустая строка.
          FIRST_LINE="$(printf '%s\n' "$COMMIT_MSG" | awk 'NF{print; exit}')"
          echo "First line: $FIRST_LINE"

          # Извлекаем X.Y.Z из `vX.Y.Z` в начале первой строки.
          if [[ ! "$FIRST_LINE" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "::notice::First line does not start with vX.Y.Z — skipping release."
            # Выходим кодом 0, чтобы зелёный билд не падал на обычных коммитах.
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${BASH_REMATCH[1]}"
          echo "Detected version: $VERSION"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Release notes = полное сообщение коммита, с заголовком vX.Y.Z.
          {
            echo "## v$VERSION"
            echo
            printf '%s\n' "$COMMIT_MSG"
          } > release_notes.md

      - name: Verify version in manifests
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"

          for f in src/manifest.json src/manifest.firefox.json; do
            actual="$(jq -r '.version' "$f")"
            if [[ "$actual" != "$VERSION" ]]; then
              echo "::error file=$f::version '$actual' does not match release '$VERSION'." \
                   "Обновите \"version\" в $f и перекоммитьте."
              exit 1
            fi
            echo "$f: $actual ✓"
          done

      - name: Check JS module syntax
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # node --check парсит синтаксис без исполнения и без резолва импортов.
          # Парсим файлы как ES-модули через временную копию с расширением .mjs:
          # node --input-type=module со stdin ведёт себя по-разному в разных
          # версиях Node, а расширение .mjs гарантирует ESM-парсинг везде.
          for f in src/newtab/js/*.js src/options/js/*.js; do
            tmp="$(mktemp --suffix=.mjs)"
            cp "$f" "$tmp"
            node --check "$tmp"
            rm -f "$tmp"
          done
          echo "ES modules syntax: OK"

      # src/i18n/generated/*.js — производный артефакт, в git не хранится
      # (генерируется из src/i18n/*.json). Генерируем заранее, чтобы сломанный
      # JSON-словарь или генератор упали до шага сборки с понятной ошибкой.
      - name: Generate i18n bridge scripts
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/gen-i18n.mjs
          node --check src/i18n/generated/ui.js
          node --check src/i18n/generated/symbols.js
          echo "i18n bridge scripts: OK"

      - name: Run robot unit tests
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Юнит-тесты чистой логики (src/lib/core.js, src/lib/storage.js)
          # на Robot Framework — те же, что гоняются локально.
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet -r tests/requirements.txt
          PYTHON="$(pwd)/.venv/bin/python" ./tests/run_tests.sh
          echo "Robot tests: OK"

      - name: Build artifacts
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh all
          echo "--- dist/chrome ---"
          ls -la dist/chrome
          echo "--- dist/firefox ---"
          ls -la dist/firefox

      - name: Check Sync
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          chmod +x scripts/check-sync.sh
          ./scripts/check-sync.sh

      - name: Package archives
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"

          # В Firefox-сборке Firefox-манифест лежит как manifest.json,
          # а manifest.firefox.json туда не попадает (build.sh его выкидывает).
          # Поэтому просто архивируем всё содержимое папок.
          # Firefox-сборка упаковывается в .xpi (неподписанную) — суффикс -unsign.

          (cd dist/chrome   && zip -r "../../tabula-chrome-v${VERSION}-unsign.zip"   .)
          (cd dist/firefox  && zip -r "../../tabula-firefox-v${VERSION}-unsign.xpi"  .)

          ls -la tabula-*.zip tabula-*.xpi
          unzip -l "tabula-chrome-v${VERSION}-unsign.zip"  | tail -n +4 | head -n -2 || true
          echo "---"
          unzip -l "tabula-firefox-v${VERSION}-unsign.xpi" | tail -n +4 | head -n -2 || true

      - name: Create git tag
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="v${VERSION}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Тег пересоздаётся при каждом запуске (в том числе Re-run).
          # Force-пуш идемпотентен: если тег уже существует — он просто
          # обновится на HEAD, без удаления (так нет гонки с релизом).
          git tag -f "$TAG" HEAD
          git push --force origin "refs/tags/$TAG"
          echo "Pushed tag $TAG at $(git rev-parse --short HEAD)."

      # Публикуем релиз НЕДЕСТРУКТИВНО: не пересоздаём и не удаляем
      # существующие ассеты (в т.ч. подписанный xpi, загруженный вручную).
      # При Re-run релиз уже существует — создание пропускаем, а -unsign
      # архивы просто доливаем/перезаписываем через `gh release upload
      # --clobber`, что НЕ трогает подписанный файл. Шаг Sync ниже сможет
      # его найти и дописать update_hash (раньше allowUpdates:true стирал
      # ручной подписанный xpi ещё до шага Sync).
      - name: Publish GitHub Release
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="v${VERSION}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Tabula v${VERSION}" \
              --notes-file release_notes.md
            echo "Created release $TAG."
          else
            echo "Release $TAG already exists — skipping create (non-destructive)."
          fi

          # Доливаем/обновляем только неподписанные сборки. Подписанный
          # tabula-firefox-vX.Y.Z.xpi (без -unsign), загруженный вручную,
          # остаётся нетронутым.
          gh release upload "$TAG" \
            "tabula-chrome-v${VERSION}-unsign.zip" \
            "tabula-firefox-v${VERSION}-unsign.xpi" \
            --clobber
          echo "Uploaded unsign artifacts to release $TAG."

      # Пишем статический снимок релиза на сайте. update_hash (sha256
      # подписанного xpi) пока НЕ добавляем — файл ещё не подписан в AMO.
      # Его допишет отдельный воркфлоу firefox-finalize.yml (ручной запуск
      # после загрузки подписанного xpi). Сам коммит меняет site/**, поэтому
      # site.yml автоматически пересоберёт сайт (без префикса в сообщении).
      - name: Write site snapshot (latest.json + updates.json)
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="v${VERSION}"
          ADDON_ID="tabula@withersky.local"
          SIGNED_XPI="tabula-firefox-v${VERSION}.xpi"

          cat > site/latest.json <<EOF
          {
            "tag": "${TAG}",
            "chrome": "tabula-chrome-v${VERSION}-unsign.zip",
            "firefox": "tabula-firefox-v${VERSION}-unsign.xpi"
          }
          EOF

          cat > site/updates.json <<EOF
          {
            "addons": {
              "${ADDON_ID}": {
                "updates": [
                  {
                    "version": "${VERSION}",
                    "update_link": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${SIGNED_XPI}"
                  }
                ]
              }
            }
          }
          EOF

          echo "--- site/updates.json ---"
          cat site/updates.json

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/latest.json site/updates.json
          if git diff --cached --quiet; then
            echo "Site files unchanged — nothing to commit."
          else
            git commit -m "release: update site snapshot for ${TAG}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Pushed site/latest.json and site/updates.json (${TAG})."
          fi

          # Пуш от GITHUB_TOKEN не триггерит соседние workflow (защита от
          # рекурсии), поэтому site.yml по path filter site/** не запустится
          # сам. Явно дёрнем деплой сайта, чтобы Pages обновил latest.json/updates.json.
          echo "Triggering site deploy (site.yml)…"
          gh workflow run site.yml --ref "${GITHUB_REF_NAME}"

      # Финализацию Firefox-обновления (добавление update_hash) вынесли в
      # отдельный воркфлоу firefox-finalize.yml. Запускайте его вручную
      # (Actions → firefox-finalize) ПОСЛЕ того, как подписанный
      # tabula-firefox-vX.Y.Z.xpi загружен в релиз.
